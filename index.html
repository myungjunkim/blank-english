<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어회화 빈칸 채우기</title>
<meta name="theme-color" content="#2f6f4f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --line: #ddd9d0;
    --text: #23211d;
    --muted: #6f6a61;
    --accent: #2f6f4f;
    --wrong: #b23b3b;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    padding: 1.5rem 1rem 3rem;
    background: var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", "맑은 고딕", -apple-system, sans-serif;
    line-height: 1.6;
  }

  #app { max-width: 34rem; margin: 0 auto; }

  h1 { margin: 0 0 .25rem; font-size: 1.4rem; }
  .lead { margin: 0 0 1.5rem; color: var(--muted); font-size: .9rem; }

  /* ── ① 카테고리 선택 ───────────────────────────── */
  .category-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }

  .category-btn {
    width: 100%;
    padding: 1rem;
    border: 1px solid var(--line);
    border-radius: .6rem;
    background: var(--surface);
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
  }
  .category-btn:hover { border-color: var(--accent); }
  .category-btn .count { color: var(--muted); font-size: .85rem; white-space: nowrap; }

  /* ── ② 문제 ───────────────────────────────────── */
  .quiz-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
  }
  .progress { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }

  .quiz-ko { margin: 0 0 .75rem; color: var(--muted); font-size: .95rem; }
  .quiz-en { margin: 0 0 .75rem; font-size: 1.25rem; line-height: 1.7; }
  .quiz-hint { margin: 0 0 1.5rem; color: var(--muted); font-size: .875rem; }

  .blank {
    display: inline-block;
    min-width: 4.5em;
    border-bottom: 2px solid var(--accent);
    text-align: center;
  }
  /* 채워진 상태에서는 min-width를 없애 문장이 자연스러운 간격으로 읽히게 합니다 */
  .blank.filled { min-width: 0; border-bottom-color: transparent; font-weight: 700; color: var(--accent); }

  #answer-form { display: flex; gap: .5rem; }
  #answer-input {
    flex: 1;
    min-width: 0;
    padding: .7rem .8rem;
    border: 1px solid var(--line);
    border-radius: .4rem;
    background: var(--surface);
    color: inherit;
    font: inherit;
  }
  #answer-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  button { cursor: pointer; font: inherit; }
  .btn-primary {
    padding: .7rem 1.2rem;
    border: none;
    border-radius: .4rem;
    background: var(--accent);
    color: #fff;
    white-space: nowrap;
  }
  .btn-primary:disabled { background: var(--line); color: var(--muted); cursor: default; }
  .btn-text {
    border: none;
    background: none;
    color: var(--muted);
    text-decoration: underline;
    padding: .2rem;
  }

  /* ── 채점 결과 ─────────────────────────────────── */
  #feedback { margin-top: 1.5rem; }
  .verdict { margin: 0 0 .75rem; font-weight: 700; }
  .verdict.ok { color: var(--accent); }
  .verdict.no { color: var(--wrong); }

  .answer-compare { margin: 0 0 .75rem; font-size: .95rem; }
  .answer-compare .mine { color: var(--wrong); text-decoration: line-through; }
  .answer-compare .right { color: var(--accent); font-weight: 700; }

  .full-sentence {
    margin: 0 0 .5rem;
    padding: .8rem;
    border-radius: .4rem;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .note { margin: 0 0 1.25rem; color: var(--muted); font-size: .875rem; }

  /* ── ③ 결과 ───────────────────────────────────── */
  .score { margin: 0 0 .25rem; font-size: 1.5rem; font-weight: 700; }
  .score-label { margin: 0 0 1.5rem; color: var(--muted); font-size: .875rem; }

  .wrong-list { list-style: none; margin: 0 0 1.5rem; padding: 0; display: grid; gap: .6rem; }
  .wrong-list li {
    padding: .8rem;
    border: 1px solid var(--line);
    border-radius: .4rem;
    background: var(--surface);
    font-size: .95rem;
  }
  .wrong-list .ko { color: var(--muted); font-size: .85rem; }

  .result-actions { display: flex; flex-wrap: wrap; gap: .6rem; }
</style>
</head>
<body>
<main id="app">

  <!-- ① 카테고리 선택 -->
  <section id="screen-category">
    <h1>영어회화 빈칸 채우기</h1>
    <p class="lead">카테고리를 골라 시작하세요. 틀린 문장은 맞출 때까지 다시 나옵니다.</p>
    <ul id="category-list" class="category-list"></ul>
  </section>

  <!-- ② 문제 -->
  <section id="screen-quiz" hidden>
    <div class="quiz-head">
      <span id="progress" class="progress"></span>
      <button type="button" id="btn-exit" class="btn-text">나가기</button>
    </div>

    <p id="quiz-ko" class="quiz-ko"></p>
    <p id="quiz-en" class="quiz-en"></p>
    <p id="quiz-hint" class="quiz-hint"></p>

    <form id="answer-form" autocomplete="off">
      <input id="answer-input" type="text" autocapitalize="off" spellcheck="false" aria-label="빈칸에 들어갈 단어">
      <button type="submit" id="btn-check" class="btn-primary" disabled>확인</button>
    </form>

    <div id="feedback" hidden>
      <p id="verdict" class="verdict"></p>
      <p id="answer-compare" class="answer-compare" hidden></p>
      <p id="full-sentence" class="full-sentence"></p>
      <p id="note" class="note"></p>
      <button type="button" id="btn-next" class="btn-primary">다음</button>
    </div>
  </section>

  <!-- ③ 결과 -->
  <section id="screen-result" hidden>
    <h1>세션 완료</h1>
    <p id="score" class="score"></p>
    <p class="score-label">첫 시도에 맞춘 개수입니다. 모든 문장은 맞출 때까지 반복되므로 이 값이 실제 지표입니다.</p>

    <div id="wrong-section" hidden>
      <p class="lead">한 번이라도 틀린 문장</p>
      <ul id="wrong-list" class="wrong-list"></ul>
    </div>

    <div class="result-actions">
      <button type="button" id="btn-retry" class="btn-primary">다시하기</button>
      <button type="button" id="btn-home" class="btn-text">카테고리 선택으로</button>
    </div>
  </section>

</main>

<script src="sentences.js"></script>
<script>
"use strict";

// 카테고리 표시 이름. 6개를 모두 정의해 두고, 화면에는 문장이 있는 것만 보여줍니다.
// 여기 정의된 순서대로 화면에 표시됩니다.
const CATEGORY_NAMES = {
  "daily-greeting": "인사 · 스몰토크",
  "daily-request":  "부탁 · 요청 · 허락 구하기",
  "daily-opinion":  "감정 · 의견 표현",
  "travel-airport": "공항 · 입국심사 · 기내",
  "travel-hotel":   "숙소 · 체크인 · 문제 해결",
  "travel-out":     "식당 · 쇼핑 · 길찾기 · 교통"
};

const BLANK = "___";
const STORAGE_KEY = "blank-fill-session";

const el = (id) => document.getElementById(id);

// 진행 중인 세션 상태. 카테고리 선택 화면에서는 null입니다.
let session = null;

/* ── 카테고리 도출 ─────────────────────────────────
   SENTENCES에서 카테고리별 문장 수를 세어, 1개 이상인 것만 반환합니다.
   CATEGORY_NAMES에 없는 카테고리도 누락되지 않도록 뒤에 덧붙입니다. */
function listCategories() {
  const counts = new Map();
  for (const s of SENTENCES) {
    counts.set(s.category, (counts.get(s.category) || 0) + 1);
  }

  const ordered = Object.keys(CATEGORY_NAMES).filter((key) => counts.has(key));
  const unknown = [...counts.keys()].filter((key) => !(key in CATEGORY_NAMES));

  return [...ordered, ...unknown].map((key) => ({
    key: key,
    name: CATEGORY_NAMES[key] || key,
    count: counts.get(key)
  }));
}

/* ── 화면 전환 ───────────────────────────────────── */
function showScreen(name) {
  el("screen-category").hidden = name !== "category";
  el("screen-quiz").hidden     = name !== "quiz";
  el("screen-result").hidden   = name !== "result";
}

/* ── ① 카테고리 선택 ─────────────────────────────── */
function renderCategoryScreen() {
  session = null;
  clearSavedSession();   // 나가기·홈으로가 모두 여기로 오므로 한 곳에서 정리합니다
  const list = el("category-list");
  list.textContent = "";

  for (const category of listCategories()) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "category-btn";

    const name = document.createElement("span");
    name.textContent = category.name;

    const count = document.createElement("span");
    count.className = "count";
    count.textContent = category.count + "문장";

    button.append(name, count);
    button.addEventListener("click", () => startSession(category.key));

    const item = document.createElement("li");
    item.appendChild(button);
    list.appendChild(item);
  }

  showScreen("category");
}

/* ── 세션 시작 ───────────────────────────────────── */
function shuffle(items) {
  const result = items.slice();
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function startSession(categoryKey) {
  const pool = SENTENCES.filter((s) => s.category === categoryKey);

  session = {
    categoryKey: categoryKey,
    total: pool.length,
    queue: shuffle(pool),   // 맨 앞이 현재 문제. 틀리면 맨 뒤로 다시 들어갑니다.
    solved: new Set(),      // 한 번이라도 맞춘 문장 id (진행도 분자)
    attempted: new Set(),   // 이미 채점해 본 문장 id (첫 시도 판별용)
    wrong: new Set(),       // 한 번이라도 틀린 문장 id (결과 화면 목록)
    firstTryCorrect: 0
  };

  // 화면을 먼저 보이게 해야 renderQuiz()의 input.focus()가 동작합니다.
  // hidden(display:none) 상태의 요소는 포커스를 받을 수 없습니다.
  showScreen("quiz");
  renderQuiz();
  saveSession();
}

/* ── 진행 상황 저장 ───────────────────────────────
   폰에서는 앱이 쉽게 백그라운드로 밀려 내려가므로, 세션을 localStorage에 남깁니다.
   Set은 JSON으로 직렬화되지 않아 배열로 바꿔 저장하고 복원할 때 되돌립니다. */
function saveSession() {
  if (!session) return;

  const data = {
    categoryKey: session.categoryKey,
    queue: session.queue.map((sentence) => sentence.id),
    solved: [...session.solved],
    attempted: [...session.attempted],
    wrong: [...session.wrong],
    firstTryCorrect: session.firstTryCorrect
  };

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (error) {
    // 저장 공간이 막혀 있어도 학습 자체는 계속되어야 하므로 넘어갑니다.
  }
}

function clearSavedSession() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (error) {
    // 위와 같은 이유로 넘어갑니다.
  }
}

// 저장된 세션을 되살립니다. 되살릴 것이 없으면 false를 반환합니다.
// 문장이 지워지거나 바뀐 경우를 대비해, 지금 데이터에 없는 id는 걸러냅니다.
function restoreSession() {
  let data = null;
  try {
    data = JSON.parse(localStorage.getItem(STORAGE_KEY));
  } catch (error) {
    return false;
  }
  if (!data || !data.categoryKey) return false;

  const pool = SENTENCES.filter((s) => s.category === data.categoryKey);
  const byId = new Map(pool.map((s) => [s.id, s]));

  const queue = (data.queue || []).map((id) => byId.get(id)).filter(Boolean);
  if (queue.length === 0) {
    clearSavedSession();
    return false;
  }

  const keepKnown = (ids) => new Set((ids || []).filter((id) => byId.has(id)));

  session = {
    categoryKey: data.categoryKey,
    total: pool.length,
    queue: queue,
    solved: keepKnown(data.solved),
    attempted: keepKnown(data.attempted),
    wrong: keepKnown(data.wrong),
    // 문장이 줄어든 경우 저장된 점수가 전체 수를 넘을 수 있어 잘라냅니다.
    firstTryCorrect: Math.min(data.firstTryCorrect || 0, pool.length)
  };

  showScreen("quiz");
  renderQuiz();
  return true;
}

/* ── ② 문제 ─────────────────────────────────────── */

// 영어 문장의 ___ 자리를 span으로 바꿉니다. filled가 주어지면 그 값을 채웁니다.
function renderSentenceInto(target, en, filled) {
  target.textContent = "";
  const parts = en.split(BLANK);

  target.appendChild(document.createTextNode(parts[0]));

  const blank = document.createElement("span");
  blank.className = filled ? "blank filled" : "blank";
  blank.textContent = filled || "";
  target.appendChild(blank);

  target.appendChild(document.createTextNode(parts[1]));
}

// 진행도 = 한 번이라도 맞춘 문장 수 / 카테고리 전체 문장 수
function updateProgress() {
  el("progress").textContent = session.solved.size + " / " + session.total;
}

// 힌트 줄 문구를 만듭니다. 글자 수는 정답 후보들의 길이가 모두 같을 때만 붙입니다.
// 길이가 서로 다르면(check/bill 등) 특정 길이를 알려주는 것이 오히려 틀린 정보가 됩니다.
function hintText(sentence) {
  const parts = [];
  if (sentence.hint) parts.push(sentence.hint);

  const lengths = new Set(sentence.accept.map((valid) => valid.trim().length));
  if (lengths.size === 1) parts.push([...lengths][0] + "글자");

  return parts.join(" · ");
}

function renderQuiz() {
  const current = session.queue[0];

  updateProgress();
  el("quiz-ko").textContent = current.ko;
  renderSentenceInto(el("quiz-en"), current.en, null);

  const hint = el("quiz-hint");
  hint.textContent = hintText(current);
  hint.hidden = !hint.textContent;

  const input = el("answer-input");
  input.value = "";
  input.disabled = false;

  el("btn-check").disabled = true;
  el("answer-form").hidden = false;
  el("feedback").hidden = true;

  input.focus();
}

// 소문자 변환 + 앞뒤 공백 제거 후 정확히 일치하는지만 봅니다. 오타는 허용하지 않습니다.
function isCorrect(input, accept) {
  const normalized = input.trim().toLowerCase();
  return accept.some((valid) => valid.trim().toLowerCase() === normalized);
}

function check() {
  const current = session.queue[0];
  const raw = el("answer-input").value;
  if (!raw.trim()) return;   // 빈 입력은 채점하지 않습니다

  const correct = isCorrect(raw, current.accept);
  const firstAttempt = !session.attempted.has(current.id);
  session.attempted.add(current.id);

  if (correct) {
    session.solved.add(current.id);
    session.queue.shift();
    if (firstAttempt) session.firstTryCorrect++;
  } else {
    session.wrong.add(current.id);
    session.queue.push(session.queue.shift());   // 큐 맨 뒤로 다시 넣습니다
  }

  // 채점 직후에 저장합니다. 다음 버튼을 누른 시점에 저장하면, 앱이 그 사이에 내려갔을 때
  // 방금 푼 문제가 안 푼 것으로 되돌아가 첫 시도 점수가 실제보다 후하게 계산됩니다.
  saveSession();

  renderFeedback(current, raw, correct);
}

function renderFeedback(sentence, userAnswer, correct) {
  updateProgress();   // 채점 직후 바로 반영. 없으면 다음 문제로 넘어갈 때까지 값이 낡아 보입니다.

  const verdict = el("verdict");
  verdict.textContent = correct ? "정답입니다" : "오답입니다";
  verdict.className = correct ? "verdict ok" : "verdict no";

  const compare = el("answer-compare");
  if (correct) {
    compare.hidden = true;
  } else {
    compare.textContent = "";
    const mine = document.createElement("span");
    mine.className = "mine";
    mine.textContent = userAnswer.trim();
    const right = document.createElement("span");
    right.className = "right";
    right.textContent = sentence.accept.join(" / ");
    compare.append(mine, document.createTextNode("  →  "), right);
    compare.hidden = false;
  }

  renderSentenceInto(el("full-sentence"), sentence.en, sentence.accept[0]);

  const note = el("note");
  note.textContent = sentence.note || "";
  note.hidden = !sentence.note;

  el("quiz-hint").hidden = true;   // 정답이 공개된 상태라 힌트는 숨깁니다
  el("answer-input").disabled = true;
  el("answer-form").hidden = true;
  el("feedback").hidden = false;

  // 다음 버튼에 포커스를 줘서, 채점된 상태에서 Enter를 누르면 다음 문제로 넘어갑니다.
  el("btn-next").focus();
}

function next() {
  if (session.queue.length === 0) {
    renderResult();
  } else {
    renderQuiz();
  }
}

/* ── ③ 결과 ─────────────────────────────────────── */
function renderResult() {
  clearSavedSession();   // 세션이 끝났으므로 이어하기 대상이 아닙니다
  el("score").textContent = session.firstTryCorrect + " / " + session.total;

  const wrongIds = [...session.wrong];
  el("wrong-section").hidden = wrongIds.length === 0;

  const list = el("wrong-list");
  list.textContent = "";
  for (const id of wrongIds) {
    const sentence = SENTENCES.find((s) => s.id === id);

    const ko = document.createElement("div");
    ko.className = "ko";
    ko.textContent = sentence.ko;

    const en = document.createElement("div");
    renderSentenceInto(en, sentence.en, sentence.accept[0]);

    const item = document.createElement("li");
    item.append(ko, en);
    list.appendChild(item);
  }

  showScreen("result");
}

/* ── 이벤트 연결 ─────────────────────────────────── */
el("answer-input").addEventListener("input", (event) => {
  el("btn-check").disabled = !event.target.value.trim();
});

el("answer-form").addEventListener("submit", (event) => {
  event.preventDefault();
  check();
});

el("btn-next").addEventListener("click", next);
el("btn-exit").addEventListener("click", renderCategoryScreen);
el("btn-retry").addEventListener("click", () => startSession(session.categoryKey));
el("btn-home").addEventListener("click", renderCategoryScreen);

// 풀던 세션이 남아 있으면 그 문제로 바로 돌아갑니다.
if (!restoreSession()) renderCategoryScreen();

// 서비스워커 등록. file://로 열면 지원되지 않으므로 조용히 넘어갑니다.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
