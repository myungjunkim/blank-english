<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어회화 빈칸 채우기</title>
<meta name="theme-color" content="#16203a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* 영문 전용 서브셋. unicode-range를 latin으로 한정해 한글은 시스템 폰트로 떨어집니다. */
  @font-face {
    font-family: "Newsreader";
    src: url("newsreader-latin.woff2") format("woff2");
    font-weight: 400 700;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+2000-206F, U+2122, U+2212;
  }

  :root {
    --ground:    #16203a;   /* 깊은 잉크 남색 — 앱 바탕 */
    --ground-2:  #24304f;   /* 바탕 위 옅은 면 */
    --on-ground: #e7e1d5;   /* 어두운 바탕 위 글자 */
    --on-ground-2: #96a0b8;

    --paper:  #fbf6ec;      /* 따뜻한 종이 — 문장이 놓이는 면 */
    --ink:    #171310;      /* 종이 위 본문 */
    --ink-2:  #736858;      /* 종이 위 보조 */
    --rule:   #ded2be;      /* 종이 위 선·빈 칸 */

    --signal: #ff7a1a;      /* 신호 주황 — 지금 채우는 칸, 진도, 기본 버튼 */
    --good:   #0d7a52;
    --miss:   #cc3326;

    --en:   "Newsreader", Georgia, "Times New Roman", serif;
    --ko:   system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    padding: 1.6rem 1.1rem 4rem;
    background: var(--ground);
    color: var(--on-ground);
    font-family: var(--ko);
    line-height: 1.65;
    -webkit-text-size-adjust: 100%;
    word-break: keep-all;   /* 한글이 낱말 중간에서 잘리지 않게 합니다 */
  }

  /* 영어가 주인 요소는 기본 줄바꿈을 씁니다 */
  .quiz-en, .answer-compare, .wrong-list .en { word-break: normal; }

  #app { max-width: 34rem; margin: 0 auto; }

  h1 { margin: 0 0 .4rem; font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; }
  .lead { margin: 0 0 1.5rem; color: var(--on-ground-2); font-size: .85rem; }

  button { cursor: pointer; font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }

  /* 수치·라벨은 고정폭으로 통일합니다 */
  .mono { font-family: var(--mono); font-size: .78rem; letter-spacing: .04em; }

  /* 종이 면 — 읽고 조작하는 것은 모두 이 위에 올립니다 */
  .card {
    background: var(--paper);
    color: var(--ink);
    border-radius: .7rem;
    padding: 1.15rem 1.15rem 1.25rem;
  }

  /* ── 진도 칸 ──────────────────────────────────────
     문장 하나가 칸 하나입니다. 빈칸의 글자 칸과 같은 언어를 씁니다. */
  .cells {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(9px, 1fr));
    gap: 3px;
    margin-top: .65rem;
  }
  .cells span {
    display: block;
    aspect-ratio: 1;
    border-radius: 1px;
    background: var(--rule);
  }
  .cells span.on { background: var(--signal); }

  /* ── ① 카테고리 선택 ───────────────────────────── */
  .category-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }

  .category-btn {
    width: 100%;
    display: block;
    border: none;
    text-align: left;
    transition: transform .12s;
  }
  .category-btn:hover { transform: translateY(-1px); }
  .category-btn .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
  }
  .category-btn .name { font-size: .98rem; font-weight: 600; letter-spacing: -.01em; }
  .category-btn .count { white-space: nowrap; color: var(--ink-2); }

  /* ── ② 문장 수 선택 ─────────────────────────────── */
  .screen-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 1.15rem;
  }
  .screen-head .title { font-size: .98rem; font-weight: 600; }
  .screen-head .mono { color: var(--on-ground-2); }

  .size-lead { margin: 0 0 1rem; color: var(--on-ground-2); font-size: .85rem; }

  .size-list {
    list-style: none;
    margin: 0 0 1.6rem;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr));
    gap: .6rem;
  }
  .size-btn {
    width: 100%;
    border: none;
    padding: 1.15rem .6rem;
    font-family: var(--mono);
    font-size: .88rem;
    white-space: nowrap;
    transition: transform .12s, color .12s;
  }
  .size-btn:hover { transform: translateY(-1px); color: var(--signal); }
  /* '남은 전부'는 개수를 고르는 것과 성격이 달라 한 줄을 다 씁니다 */
  .size-btn.all { grid-column: 1 / -1; }

  .reset-area { margin: 0; color: var(--on-ground-2); font-size: .8rem; }

  .btn-text {
    border: none;
    background: none;
    padding: .2rem;
    color: var(--on-ground-2);
    font-size: .8rem;
    text-decoration: underline;
    text-underline-offset: .18em;
  }
  .btn-text:hover { color: var(--on-ground); }
  .btn-text.danger { color: #ff8b80; }

  /* ── ③ 문제 ───────────────────────────────────── */
  .question { margin-bottom: 1rem; }

  .quiz-ko { margin: 0 0 .85rem; color: var(--ink-2); font-size: .88rem; }

  .quiz-en {
    margin: 0 0 1.05rem;
    font-family: var(--en);
    font-size: 1.42rem;
    font-variation-settings: "opsz" 30;
    line-height: 1.8;
    letter-spacing: -.005em;
  }

  /* 빈칸 — 정답 글자 수만큼 칸을 놓습니다.
     칸 너비는 글자 수에 따라 JS가 --cell로 정합니다. 긴 답도 한 줄에 들어가게 하기 위함입니다. */
  .blank {
    display: inline-flex;
    flex-wrap: wrap;          /* 그래도 넘치면 줄을 바꿔 가로 스크롤을 막습니다 */
    gap: 3px;
    margin: 0 .2em;
    vertical-align: -.34em;
  }
  .blank .cell {
    width: var(--cell, .95em);
    height: 1.45em;
    border: 1.5px solid var(--rule);
    border-radius: 3px;
    font-family: var(--mono);
    font-size: .78em;
    font-weight: 600;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color .12s, border-color .12s, color .12s;
  }
  /* 채워진 칸은 색으로 찹니다. 타이핑하면 문장에 색이 칠해집니다. */
  .blank .cell.on {
    background: var(--signal);
    border-color: var(--signal);
    color: #2a1300;   /* 주황 위 흰 글자는 대비가 모자라 어두운 갈색을 씁니다 */
  }
  .blank .cell.next { border-color: var(--signal); box-shadow: inset 0 -3px 0 -1px var(--signal); }
  .blank.over .cell { background: var(--miss); border-color: var(--miss); color: #fff; }

  /* 정답 후보의 길이가 제각각이라 칸 수를 정할 수 없는 문항.
     칸을 나누지 않은 점선 상자 하나로 두어, 길이가 정해져 있지 않다는 것을 보여줍니다. */
  .blank.open {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 5.5em;
    height: 1.45em;
    padding: 0 .4em;
    border: 1.5px dashed var(--rule);
    border-radius: 3px;
    font-family: var(--mono);
    font-size: .78em;
    font-weight: 600;
    line-height: 1;
    transition: background-color .12s, border-color .12s, color .12s;
  }
  .blank.open.on { background: var(--signal); border-color: var(--signal); border-style: solid; color: #2a1300; }

  /* 정답이 공개된 상태 */
  .blank.filled {
    display: inline;
    margin: 0;        /* 채워진 뒤에는 뒤따르는 물음표·쉼표와 붙어야 합니다 */
    font-weight: 700;
    color: var(--good);
    border-bottom: 2px solid var(--good);
  }

  .quiz-hint {
    margin: 0;
    color: var(--ink-2);
    font-size: .85rem;
    padding-left: .75rem;
    border-left: 2px solid var(--rule);
  }

  #answer-form { display: flex; gap: .5rem; }
  #answer-input {
    flex: 1;
    min-width: 0;
    padding: .85rem .9rem;
    border: 1px solid var(--ground-2);
    border-radius: .5rem;
    background: var(--ground-2);
    color: var(--on-ground);
    font-family: var(--en);
    font-size: 1rem;
  }
  #answer-input::placeholder { color: var(--on-ground-2); }
  #answer-input:focus { outline: none; border-color: var(--signal); }

  .btn-primary {
    padding: .85rem 1.25rem;
    border: none;
    border-radius: .5rem;
    background: var(--signal);
    color: #2a1300;
    font-size: .9rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .btn-primary:disabled { background: var(--ground-2); color: var(--on-ground-2); cursor: default; }

  /* ── 채점 결과 ─────────────────────────────────── */
  #feedback { margin-top: 1rem; animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } }

  .verdict { margin: 0 0 .8rem; font-size: .9rem; font-weight: 700; letter-spacing: -.01em; }
  .verdict.ok { color: var(--good); }
  .verdict.no { color: var(--miss); }

  .answer-compare { margin: 0 0 .9rem; font-family: var(--en); font-size: 1rem; }
  .answer-compare .mine { color: var(--miss); text-decoration: line-through; }
  .answer-compare .arrow { font-family: var(--mono); color: var(--ink-2); padding: 0 .5em; }
  .answer-compare .right { color: var(--good); font-weight: 700; }

  .note { margin: 0 0 1.25rem; color: var(--ink-2); font-size: .85rem; }

  /* ── ④ 결과 ───────────────────────────────────── */
  .score {
    margin: 0 0 .3rem;
    font-family: var(--mono);
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: -.03em;
    color: var(--signal);
  }
  .score-label { margin: 0 0 .9rem; color: var(--on-ground-2); font-size: .8rem; }
  .result-progress { margin: 0 0 1.6rem; font-size: .85rem; color: var(--on-ground); }

  .wrong-lead { margin: 0 0 .7rem; color: var(--on-ground-2); font-size: .85rem; }
  .wrong-list { list-style: none; margin: 0 0 1.6rem; padding: 0; display: grid; gap: .6rem; }
  .wrong-list li { padding: .9rem 1rem; }
  .wrong-list .ko { color: var(--ink-2); font-size: .82rem; margin-bottom: .15rem; }
  .wrong-list .en { font-family: var(--en); font-size: 1rem; }

  .result-actions { display: flex; flex-wrap: wrap; gap: .7rem; align-items: center; }

  @media (max-width: 26rem) {
    .quiz-en { font-size: 1.24rem; }
    .card { padding: 1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main id="app">

  <!-- ① 카테고리 선택 -->
  <section id="screen-category">
    <h1>영어회화 빈칸 채우기</h1>
    <p class="lead">카테고리를 골라 시작하세요. 첫 시도에 맞춘 문장은 완료되어 다시 나오지 않습니다.</p>
    <ul id="category-list" class="category-list"></ul>
  </section>

  <!-- ② 문장 수 선택 -->
  <section id="screen-size" hidden>
    <div class="screen-head">
      <span id="size-title" class="title"></span>
      <button type="button" id="btn-size-back" class="btn-text">뒤로</button>
    </div>

    <p id="size-lead" class="size-lead"></p>
    <ul id="size-list" class="size-list"></ul>

    <p class="reset-area">
      <button type="button" id="btn-reset" class="btn-text">진도 초기화</button>
      <span id="reset-confirm" hidden>
        정말 지울까요?
        <button type="button" id="btn-reset-yes" class="btn-text danger">지우기</button>
        <button type="button" id="btn-reset-no" class="btn-text">취소</button>
      </span>
    </p>
  </section>

  <!-- ③ 문제 -->
  <section id="screen-quiz" hidden>
    <div class="screen-head">
      <span id="progress" class="mono"></span>
      <button type="button" id="btn-exit" class="btn-text">나가기</button>
    </div>

    <div class="card question">
      <p id="quiz-ko" class="quiz-ko"></p>
      <p id="quiz-en" class="quiz-en"></p>
      <p id="quiz-hint" class="quiz-hint"></p>
    </div>

    <form id="answer-form" autocomplete="off">
      <input id="answer-input" type="text" autocapitalize="off" spellcheck="false" aria-label="빈칸에 들어갈 단어">
      <button type="submit" id="btn-check" class="btn-primary" disabled>확인</button>
    </form>

    <div id="feedback" class="card" hidden>
      <p id="verdict" class="verdict"></p>
      <p id="answer-compare" class="answer-compare" hidden></p>
      <p id="note" class="note"></p>
      <button type="button" id="btn-next" class="btn-primary">다음</button>
    </div>
  </section>

  <!-- ④ 결과 -->
  <section id="screen-result" hidden>
    <h1>세션 완료</h1>
    <p id="score" class="score"></p>
    <p class="score-label">첫 시도에 맞춘 개수입니다. 모든 문장은 맞출 때까지 반복되므로 이 값이 실제 지표입니다.</p>
    <p id="result-progress" class="result-progress"></p>

    <div id="wrong-section" hidden>
      <p class="wrong-lead">한 번이라도 틀린 문장</p>
      <ul id="wrong-list" class="wrong-list"></ul>
    </div>

    <div class="result-actions">
      <button type="button" id="btn-retry" class="btn-primary">이어서 더 풀기</button>
      <button type="button" id="btn-home" class="btn-text">카테고리 선택으로</button>
    </div>
  </section>

</main>

<script src="sentences.js"></script>
<script>
"use strict";

// 카테고리 표시 이름. 6개를 모두 정의해 두고, 화면에는 문장이 있는 것만 보여줍니다.
// 여기 정의된 순서대로 화면에 표시됩니다.
const CATEGORY_NAMES = {
  "daily-greeting": "인사 · 스몰토크",
  "daily-request":  "부탁 · 요청 · 허락 구하기",
  "daily-opinion":  "감정 · 의견 표현",
  "travel-airport": "공항 · 입국심사 · 기내",
  "travel-hotel":   "숙소 · 체크인 · 문제 해결",
  "travel-out":     "식당 · 쇼핑 · 길찾기 · 교통"
};

const BLANK = "___";
const STORAGE_KEY = "blank-fill-session";
const PROGRESS_KEY = "blank-fill-progress";

// 개수 선택 화면에 띄울 후보. 남은 문장 수보다 작은 것만 실제로 보여줍니다.
const SIZE_OPTIONS = [5, 10, 15, 20];

const el = (id) => document.getElementById(id);

// 진행 중인 세션 상태. 카테고리·개수 선택 화면에서는 null입니다.
let session = null;

// 개수 선택 화면이 대상으로 삼고 있는 카테고리. 초기화 버튼도 이 값을 씁니다.
let sizeCategory = null;

/* ── 누적 진도 ───────────────────────────────────
   세션과 별도 키에 저장합니다. 세션은 끝나면 지워지지만 진도는 남아야 합니다.
   첫 시도에 맞춘 문장을 모아두고, 그 문장은 다시 출제하지 않습니다.
   형태: { "travel-out-01": true } */

function loadProgress() {
  try {
    const data = JSON.parse(localStorage.getItem(PROGRESS_KEY));
    if (!data || typeof data !== "object" || Array.isArray(data)) return {};

    // 완료까지 두 번 맞춰야 하던 시절의 형식({ c, d })도 함께 읽습니다.
    // 그때 한 번이라도 맞춰 c가 1 이상이던 문장은 이제 완료로 봅니다.
    const result = {};
    for (const [id, value] of Object.entries(data)) {
      const done = (value && typeof value === "object") ? value.c >= 1 : !!value;
      if (done) result[id] = true;
    }
    return result;
  } catch (error) {
    return {};   // 깨진 데이터는 없는 것으로 봅니다
  }
}

function saveProgress(progress) {
  try {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  } catch (error) {
    // 저장 공간이 막혀 있어도 학습 자체는 계속되어야 하므로 넘어갑니다.
  }
}

function isDone(progress, id) {
  return progress[id] === true;
}

// 아직 완료되지 않은 문장만 돌려줍니다.
function remainingSentences(categoryKey, progress) {
  return SENTENCES.filter((s) => s.category === categoryKey && !isDone(progress, s.id));
}

// 진도를 갱신하고, 이번에 완료되었으면 true를 돌려줍니다.
// 호출은 한 세션에서 그 문장의 '첫 시도'일 때만 해야 합니다.
// 틀린 경우에는 아무것도 하지 않습니다. 완료로 기록되지 않았으니 다음 세션에 다시 나옵니다.
function bumpProgress(id, correct) {
  if (!correct) return false;

  const progress = loadProgress();
  progress[id] = true;
  saveProgress(progress);
  return true;
}

function resetCategoryProgress(categoryKey) {
  const progress = loadProgress();
  for (const sentence of SENTENCES) {
    if (sentence.category === categoryKey) delete progress[sentence.id];
  }
  saveProgress(progress);
}

/* ── 카테고리 도출 ─────────────────────────────────
   SENTENCES에서 카테고리별 문장 수와 완료 수를 세어, 1개 이상인 것만 반환합니다.
   CATEGORY_NAMES에 없는 카테고리도 누락되지 않도록 뒤에 덧붙입니다. */
function listCategories(progress) {
  const counts = new Map();
  const done = new Map();

  for (const s of SENTENCES) {
    counts.set(s.category, (counts.get(s.category) || 0) + 1);
    if (isDone(progress, s.id)) done.set(s.category, (done.get(s.category) || 0) + 1);
  }

  const ordered = Object.keys(CATEGORY_NAMES).filter((key) => counts.has(key));
  const unknown = [...counts.keys()].filter((key) => !(key in CATEGORY_NAMES));

  return [...ordered, ...unknown].map((key) => ({
    key: key,
    name: CATEGORY_NAMES[key] || key,
    count: counts.get(key),
    done: done.get(key) || 0
  }));
}

/* ── 화면 전환 ───────────────────────────────────── */
function showScreen(name) {
  el("screen-category").hidden = name !== "category";
  el("screen-size").hidden     = name !== "size";
  el("screen-quiz").hidden     = name !== "quiz";
  el("screen-result").hidden   = name !== "result";
}

/* ── ① 카테고리 선택 ─────────────────────────────── */
function renderCategoryScreen() {
  session = null;
  sizeCategory = null;
  clearSavedSession();   // 나가기·홈으로가 모두 여기로 오므로 한 곳에서 정리합니다

  const progress = loadProgress();
  const list = el("category-list");
  list.textContent = "";

  for (const category of listCategories(progress)) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "card category-btn";

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = category.name;

    const count = document.createElement("span");
    count.className = "count mono";
    count.textContent = category.done + " / " + category.count + " 완료";

    const top = document.createElement("span");
    top.className = "top";
    top.append(name, count);

    // 문장 하나가 칸 하나입니다. 완료한 만큼 채워집니다.
    const cells = document.createElement("span");
    cells.className = "cells";
    for (let i = 0; i < category.count; i++) {
      const cell = document.createElement("span");
      if (i < category.done) cell.className = "on";
      cells.appendChild(cell);
    }

    button.append(top, cells);
    button.addEventListener("click", () => renderSizeScreen(category.key));

    const item = document.createElement("li");
    item.appendChild(button);
    list.appendChild(item);
  }

  showScreen("category");
}

/* ── ② 문장 수 선택 ─────────────────────────────── */
function hideResetConfirm() {
  el("btn-reset").hidden = false;
  el("reset-confirm").hidden = true;
}

function renderSizeScreen(categoryKey) {
  session = null;
  sizeCategory = categoryKey;
  clearSavedSession();

  const remaining = remainingSentences(categoryKey, loadProgress());

  el("size-title").textContent = CATEGORY_NAMES[categoryKey] || categoryKey;
  el("size-lead").textContent = remaining.length > 0
    ? "남은 문장 " + remaining.length + "개. 몇 문장 풀까요?"
    : "이 카테고리는 다 끝냈습니다. 다시 풀려면 진도를 초기화하세요.";

  // 남은 문장보다 큰 선택지는 고를 수 없으므로 아예 띄우지 않고,
  // 마지막에 '남은 전부'를 둡니다.
  const options = SIZE_OPTIONS.filter((size) => size < remaining.length);
  if (remaining.length > 0) options.push(remaining.length);

  const list = el("size-list");
  list.textContent = "";

  for (const size of options) {
    const button = document.createElement("button");
    button.type = "button";
    const isAll = size === remaining.length;
    button.className = isAll ? "card size-btn all" : "card size-btn";
    button.textContent = isAll ? "남은 전부 (" + size + ")" : size + "문장";
    button.addEventListener("click", () => startSession(categoryKey, size));

    const item = document.createElement("li");
    item.appendChild(button);
    list.appendChild(item);
  }

  hideResetConfirm();
  showScreen("size");
}

/* ── 세션 시작 ───────────────────────────────────── */
function shuffle(items) {
  const result = items.slice();
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function startSession(categoryKey, size) {
  // 완료된 문장은 빼고, 섞은 뒤 앞에서 필요한 만큼만 가져옵니다.
  const picked = shuffle(remainingSentences(categoryKey, loadProgress())).slice(0, size);
  if (picked.length === 0) return;

  session = {
    categoryKey: categoryKey,
    sessionSize: picked.length,
    queue: picked,          // 맨 앞이 현재 문제. 틀리면 맨 뒤로 다시 들어갑니다.
    solved: new Set(),      // 한 번이라도 맞춘 문장 id (진행도 분자)
    attempted: new Set(),   // 이미 채점해 본 문장 id (첫 시도 판별용)
    wrong: new Set(),       // 한 번이라도 틀린 문장 id (결과 화면 목록)
    completed: new Set(),   // 이번 세션에서 완료에 도달한 문장 id
    firstTryCorrect: 0
  };

  // 화면을 먼저 보이게 해야 renderQuiz()의 input.focus()가 동작합니다.
  // hidden(display:none) 상태의 요소는 포커스를 받을 수 없습니다.
  showScreen("quiz");
  renderQuiz();
  saveSession();
}

/* ── 진행 상황 저장 ───────────────────────────────
   폰에서는 앱이 쉽게 백그라운드로 밀려 내려가므로, 세션을 localStorage에 남깁니다.
   Set은 JSON으로 직렬화되지 않아 배열로 바꿔 저장하고 복원할 때 되돌립니다. */
function saveSession() {
  if (!session) return;

  const data = {
    categoryKey: session.categoryKey,
    sessionSize: session.sessionSize,
    queue: session.queue.map((sentence) => sentence.id),
    solved: [...session.solved],
    attempted: [...session.attempted],
    wrong: [...session.wrong],
    completed: [...session.completed],
    firstTryCorrect: session.firstTryCorrect
  };

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (error) {
    // 저장 공간이 막혀 있어도 학습 자체는 계속되어야 하므로 넘어갑니다.
  }
}

function clearSavedSession() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (error) {
    // 위와 같은 이유로 넘어갑니다.
  }
}

// 저장된 세션을 되살립니다. 되살릴 것이 없으면 false를 반환합니다.
// 문장이 지워지거나 바뀐 경우를 대비해, 지금 데이터에 없는 id는 걸러냅니다.
function restoreSession() {
  let data = null;
  try {
    data = JSON.parse(localStorage.getItem(STORAGE_KEY));
  } catch (error) {
    return false;
  }
  // sessionSize가 없으면 세션 단위 학습 이전의 옛 저장 데이터입니다. 되살리지 않고 버립니다.
  if (!data || !data.categoryKey || !(data.sessionSize > 0)) {
    clearSavedSession();
    return false;
  }

  const pool = SENTENCES.filter((s) => s.category === data.categoryKey);
  const byId = new Map(pool.map((s) => [s.id, s]));

  const queue = (data.queue || []).map((id) => byId.get(id)).filter(Boolean);
  if (queue.length === 0) {
    clearSavedSession();
    return false;
  }

  const keepKnown = (ids) => new Set((ids || []).filter((id) => byId.has(id)));

  // 문장이 지워져 큐가 줄었을 수 있으므로, 세션 크기는 남은 큐보다 작아지지 않게 합니다.
  const sessionSize = Math.max(Math.min(data.sessionSize, pool.length), queue.length);

  session = {
    categoryKey: data.categoryKey,
    sessionSize: sessionSize,
    queue: queue,
    solved: keepKnown(data.solved),
    attempted: keepKnown(data.attempted),
    wrong: keepKnown(data.wrong),
    completed: keepKnown(data.completed),
    // 문장이 줄어든 경우 저장된 점수가 세션 크기를 넘을 수 있어 잘라냅니다.
    firstTryCorrect: Math.min(data.firstTryCorrect || 0, sessionSize)
  };

  showScreen("quiz");
  renderQuiz();
  return true;
}

/* ── ② 문제 ─────────────────────────────────────── */

// 정답 후보의 길이가 모두 같으면 그 길이를, 제각각이면 null을 돌려줍니다.
function answerLength(sentence) {
  const lengths = new Set(sentence.accept.map((valid) => valid.trim().length));
  return lengths.size === 1 ? [...lengths][0] : null;
}

// 영어 문장의 ___ 자리를 빈칸으로 바꿉니다.
// filled가 주어지면 그 단어를 채운 모습으로, 아니면 글자 수만큼의 빈 칸으로 그립니다.
function renderSentenceInto(target, sentence, filled) {
  target.textContent = "";
  const parts = sentence.en.split(BLANK);

  target.appendChild(document.createTextNode(parts[0]));

  const blank = document.createElement("span");
  if (filled) {
    blank.className = "blank filled";
    blank.textContent = filled;
  } else {
    const length = answerLength(sentence);
    if (length) {
      blank.className = "blank";
      // 답이 길수록 칸을 좁힙니다. 12글자짜리를 넓은 칸으로 두면 폰 화면을 넘칩니다.
      blank.style.setProperty("--cell", length > 9 ? ".62em" : length > 6 ? ".78em" : ".95em");
      for (let i = 0; i < length; i++) {
        const cell = document.createElement("span");
        cell.className = "cell";
        blank.appendChild(cell);
      }
    } else {
      // 답마다 길이가 달라 칸 수를 정할 수 없는 문항입니다.
      // 끊긴 밑줄 자체가 '길이가 정해져 있지 않다'는 정보를 줍니다.
      blank.className = "blank open";
    }
  }
  target.appendChild(blank);

  target.appendChild(document.createTextNode(parts[1]));
}

// 입력한 글자를 빈칸에 하나씩 옮겨 놓습니다.
function syncCells(value) {
  const blank = el("quiz-en").querySelector(".blank");
  if (!blank) return;

  const typed = value.trim();

  // 길이를 알 수 없는 문항은 칸이 없으므로 입력한 말을 그대로 흘려보냅니다.
  if (blank.classList.contains("open")) {
    blank.textContent = typed;
    blank.classList.toggle("on", typed.length > 0);
    return;
  }

  const cells = blank.querySelectorAll(".cell");
  if (!cells.length) return;

  const chars = [...typed];
  cells.forEach((cell, index) => {
    cell.textContent = chars[index] || "";
    cell.classList.toggle("on", index < chars.length);
    cell.classList.toggle("next", index === chars.length);
  });

  blank.classList.toggle("over", chars.length > cells.length);
}

// 진행도 = 한 번이라도 맞춘 문장 수 / 이번 세션에 뽑힌 문장 수
function updateProgress() {
  el("progress").textContent = session.solved.size + " / " + session.sessionSize;
}

function renderQuiz() {
  const current = session.queue[0];

  updateProgress();
  el("quiz-ko").textContent = current.ko;
  renderSentenceInto(el("quiz-en"), current, null);

  // 글자 수는 빈칸의 칸 개수가 보여주므로 힌트 문구에는 넣지 않습니다.
  const hint = el("quiz-hint");
  hint.textContent = current.hint || "";
  hint.hidden = !hint.textContent;

  const input = el("answer-input");
  input.value = "";
  input.disabled = false;
  syncCells("");

  el("btn-check").disabled = true;
  el("answer-form").hidden = false;
  el("feedback").hidden = true;

  input.focus();
}

// 소문자 변환 + 앞뒤 공백 제거 후 정확히 일치하는지만 봅니다. 오타는 허용하지 않습니다.
function isCorrect(input, accept) {
  const normalized = input.trim().toLowerCase();
  return accept.some((valid) => valid.trim().toLowerCase() === normalized);
}

function check() {
  const current = session.queue[0];
  const raw = el("answer-input").value;
  if (!raw.trim()) return;   // 빈 입력은 채점하지 않습니다

  const correct = isCorrect(raw, current.accept);
  const firstAttempt = !session.attempted.has(current.id);
  session.attempted.add(current.id);

  // 누적 진도는 이 세션에서의 첫 시도만 반영합니다. 틀린 뒤 다시 맞춘 것은
  // 그 세션을 끝내기 위한 재도전일 뿐이라 진도로 치지 않습니다.
  if (firstAttempt && bumpProgress(current.id, correct)) {
    session.completed.add(current.id);
  }

  if (correct) {
    session.solved.add(current.id);
    session.queue.shift();
    if (firstAttempt) session.firstTryCorrect++;
  } else {
    session.wrong.add(current.id);
    session.queue.push(session.queue.shift());   // 큐 맨 뒤로 다시 넣습니다
  }

  // 채점 직후에 저장합니다. 다음 버튼을 누른 시점에 저장하면, 앱이 그 사이에 내려갔을 때
  // 방금 푼 문제가 안 푼 것으로 되돌아가 첫 시도 점수가 실제보다 후하게 계산됩니다.
  saveSession();

  renderFeedback(current, raw, correct);
}

function renderFeedback(sentence, userAnswer, correct) {
  updateProgress();   // 채점 직후 바로 반영. 없으면 다음 문제로 넘어갈 때까지 값이 낡아 보입니다.

  const verdict = el("verdict");
  verdict.textContent = correct ? "정답입니다" : "오답입니다";
  verdict.className = correct ? "verdict ok" : "verdict no";

  const compare = el("answer-compare");
  if (correct) {
    compare.hidden = true;
  } else {
    compare.textContent = "";
    const mine = document.createElement("span");
    mine.className = "mine";
    mine.textContent = userAnswer.trim();
    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "→";
    const right = document.createElement("span");
    right.className = "right";
    right.textContent = sentence.accept.join(" / ");
    compare.append(mine, arrow, right);
    compare.hidden = false;
  }

  // 보고 있던 빈칸을 그 자리에서 정답으로 채웁니다. 문장을 아래에 한 번 더 보여줄 필요가 없습니다.
  renderSentenceInto(el("quiz-en"), sentence, sentence.accept[0]);

  const note = el("note");
  note.textContent = sentence.note || "";
  note.hidden = !sentence.note;

  el("quiz-hint").hidden = true;   // 정답이 공개된 상태라 힌트는 숨깁니다
  el("answer-input").disabled = true;
  el("answer-form").hidden = true;
  el("feedback").hidden = false;

  // 다음 버튼에 포커스를 줘서, 채점된 상태에서 Enter를 누르면 다음 문제로 넘어갑니다.
  el("btn-next").focus();
}

function next() {
  if (session.queue.length === 0) {
    renderResult();
  } else {
    renderQuiz();
  }
}

/* ── ③ 결과 ─────────────────────────────────────── */
function renderResult() {
  clearSavedSession();   // 세션이 끝났으므로 이어하기 대상이 아닙니다
  el("score").textContent = session.firstTryCorrect + " / " + session.sessionSize;

  const remaining = remainingSentences(session.categoryKey, loadProgress());
  el("result-progress").textContent =
    "이번에 " + session.completed.size + "개 완료 · 남은 문장 " + remaining.length + "개";

  const wrongIds = [...session.wrong];
  el("wrong-section").hidden = wrongIds.length === 0;

  const list = el("wrong-list");
  list.textContent = "";
  for (const id of wrongIds) {
    const sentence = SENTENCES.find((s) => s.id === id);

    const ko = document.createElement("div");
    ko.className = "ko";
    ko.textContent = sentence.ko;

    const en = document.createElement("div");
    en.className = "en";
    renderSentenceInto(en, sentence, sentence.accept[0]);

    const item = document.createElement("li");
    item.className = "card";
    item.append(ko, en);
    list.appendChild(item);
  }

  showScreen("result");
}

/* ── 이벤트 연결 ─────────────────────────────────── */
el("answer-input").addEventListener("input", (event) => {
  el("btn-check").disabled = !event.target.value.trim();
  syncCells(event.target.value);
});

el("answer-form").addEventListener("submit", (event) => {
  event.preventDefault();
  check();
});

el("btn-next").addEventListener("click", next);
el("btn-exit").addEventListener("click", renderCategoryScreen);
el("btn-retry").addEventListener("click", () => renderSizeScreen(session.categoryKey));
el("btn-home").addEventListener("click", renderCategoryScreen);

el("btn-size-back").addEventListener("click", renderCategoryScreen);

// 초기화는 실수로 누르기 쉬워 두 단계로 나눕니다.
// 브라우저 확인창은 쓰지 않습니다. 확인창이 뜨면 자동화 검증이 멈춥니다.
el("btn-reset").addEventListener("click", () => {
  el("btn-reset").hidden = true;
  el("reset-confirm").hidden = false;
});
el("btn-reset-no").addEventListener("click", hideResetConfirm);
el("btn-reset-yes").addEventListener("click", () => {
  resetCategoryProgress(sizeCategory);
  renderSizeScreen(sizeCategory);
});

// 풀던 세션이 남아 있으면 그 문제로 바로 돌아갑니다.
if (!restoreSession()) renderCategoryScreen();

// 서비스워커 등록. file://로 열면 지원되지 않으므로 조용히 넘어갑니다.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
